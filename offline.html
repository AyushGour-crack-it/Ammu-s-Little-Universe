<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d1c" />
    <title>A little pause · For Ammu</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia,serif; background: #090d1c; color: #f2e7d7; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 40%, #1d2030 0, #090d1c 68%); }
      main { width: min(440px, 100%); padding: 42px 28px; border: 1px solid rgba(230,197,143,.38); background: rgba(21,26,43,.7); }
      .moon { color: #e6c58f; font-size: 38px; }
      p { color: #c8bdad; line-height: 1.7; }
      a { display: inline-block; margin-top: 12px; padding: 12px 20px; border: 1px solid rgba(230,197,143,.55); border-radius: 30px; color: #e6c58f; text-decoration: none; font: 11px Arial,sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <span class="moon" aria-hidden="true">☾</span>
      <p style="font:10px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#c3a477">a little pause between us</p>
      <h1>You’re offline for a moment.</h1>
      <p>Our little universe will be here when you’re connected again. The home page and its photos are ready offline.</p>
      <a href="/">return home</a>
    </main>
  </body>
</html>
